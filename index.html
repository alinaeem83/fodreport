<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gan Airport FOD Inspection</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{background:#eef2f5;color:#17212b}header{height:58px;background:#0b2638;color:#fff;display:flex;align-items:center;padding:0 14px;font-weight:700}
header .title{font-size:17px;line-height:1.1}header small{display:block;font-weight:400;opacity:.8;font-size:11px;margin-top:2px}
#map{height:calc(100vh - 58px);width:100%}
.panel{position:fixed;z-index:1000;left:12px;right:12px;top:70px;background:rgba(255,255,255,.96);border-radius:14px;padding:10px;box-shadow:0 5px 25px rgba(0,0,0,.18)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{border:0;border-radius:10px;padding:12px 10px;font-size:14px;font-weight:700;background:#0b2638;color:white}
button.secondary{background:#e7edf1;color:#17212b}button.warn{background:#b3261e}
.status{margin-top:8px;font-size:12px}.ok{color:#167447}.err{color:#b3261e}
.modal{position:fixed;z-index:2000;inset:0;background:rgba(0,0,0,.48);display:none;align-items:flex-end}
.modal.show{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px}
h2{margin:0 0 12px;font-size:20px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #c8d0d7;border-radius:9px;font-size:15px;background:#fff}
textarea{min-height:75px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.info{background:#f1f5f7;border-radius:9px;padding:9px;font-size:12px;margin-top:8px}.actions{display:flex;gap:8px;margin-top:15px}
.actions button{flex:1}.leaflet-control-attribution{font-size:9px}
.fod-pin{font-size:25px;line-height:25px;text-shadow:0 1px 2px #fff}
</style>
</head>
<body>
<header><div class="title">GAN AIRPORT — FOD INSPECTION<small>GPS-enabled mobile inspection</small></div></header>
<div id="map"></div>

<div class="panel">
  <div class="row">
    <button id="locateBtn">📍 My Location</button>
    <button id="fodBtn">⚠️ Report FOD</button>
  </div>
  <div id="gpsStatus" class="status">GPS: waiting for permission…</div>
  <div id="positionInfo" class="status"></div>
</div>

<div id="modal" class="modal">
<div class="sheet">
<h2>Report FOD</h2>
<div class="grid">
<div><label>Latitude</label><input id="lat" readonly></div>
<div><label>Longitude</label><input id="lng" readonly></div>
<div><label>Grid</label><input id="grid" readonly></div>
<div><label>UTC Time</label><input id="utc" readonly></div>
</div>
<label>FOD Type</label>
<select id="type">
<option>Foreign object / debris</option><option>Stone / aggregate</option><option>Metal object</option>
<option>Plastic / rubber</option><option>Bird / animal remains</option><option>Vegetation</option>
<option>Loose cable / electrical item</option><option>Other</option>
</select>
<label>Description</label><textarea id="desc" placeholder="Describe the FOD, size, exact position, etc."></textarea>
<label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment">
<div class="info">The report records the GPS position and grid automatically. Reports are saved in this browser for this prototype.</div>
<div class="actions">
<button class="secondary" id="cancel">Cancel</button>
<button id="save">Save FOD Report</button>
</div>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ARP=[-0.693333,73.155556];
const RWY10=[-0.6906110048,73.1384963989];
const RWY28=[-0.6946669817,73.1647033691];
const RUNWAY_WIDTH_M=45;
const GRID_LONG_M=50, GRID_LAT_M=25;

const map=L.map('map',{zoomControl:false}).setView(ARP,15);
L.control.zoom({position:'bottomright'}).addTo(map);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'© Esri'});
L.control.layers({'Street':street,'Satellite':sat},null,{position:'bottomleft'}).addTo(map);

const runway=L.polyline([RWY10,RWY28],{color:'#f2f2f2',weight:45,opacity:.7}).addTo(map);
L.polyline([RWY10,RWY28],{color:'#333',weight:2,dashArray:'8 8',opacity:.8}).addTo(map);

function hav(a,b){
 const R=6371000, p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180;
 const dp=(b[0]-a[0])*Math.PI/180, dl=(b[1]-a[1])*Math.PI/180;
 const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return 2*R*Math.asin(Math.sqrt(x));
}
function bearing(a,b){
 const p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180;
 const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
 return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function dest(p,d,br){
 const R=6371000, b=br*Math.PI/180, lat=p[0]*Math.PI/180,lon=p[1]*Math.PI/180;
 const a=d/R, lat2=Math.asin(Math.sin(lat)*Math.cos(a)+Math.cos(lat)*Math.sin(a)*Math.cos(b));
 const lon2=lon+Math.atan2(Math.sin(b)*Math.sin(a)*Math.cos(lat),Math.cos(a)-Math.sin(lat)*Math.sin(lat2));
 return [lat2*180/Math.PI,((lon2*180/Math.PI+540)%360)-180];
}
const runBr=bearing(RWY10,RWY28);
const runLen=hav(RWY10,RWY28);
function gridFor(pos){
 const along=Math.max(0,Math.min(runLen,hav(RWY10,pos)));
 const center=dest(RWY10,along,runBr);
 const d=hav(center,pos);
 const b=(bearing(center,pos)-runBr+540)%360-180;
 const side=b>=0?'N':'S';
 const col=Math.max(1,Math.min(60,Math.floor(along/GRID_LONG_M)+1));
 const band=Math.max(1,Math.min(2,Math.floor(d/GRID_LAT_M)+1));
 return `R${String(col).padStart(2,'0')}-${side}${band}`;
}
function gridCenter(grid){
 const m=grid.match(/^R(\d+)-([NS])([12])$/); if(!m)return ARP;
 const along=(+m[1]-.5)*GRID_LONG_M;
 const side=(+m[3]-.5)*GRID_LAT_M*(m[2]==='N'?1:-1);
 return dest(dest(RWY10,along,runBr),Math.abs(side),runBr+(side>=0?90:-90));
}
for(let i=1;i<=60;i++){
 for(const s of ['N','S']) for(let k=1;k<=2;k++){
   const c=gridCenter(`R${String(i).padStart(2,'0')}-${s}${k}`);
   const halfL=GRID_LONG_M/2, halfW=GRID_LAT_M/2;
   const p1=dest(dest(c,halfL,runBr),halfW,s==='N'?runBr+90:runBr-90);
   const p2=dest(dest(c,halfL,runBr),halfW,s==='N'?runBr-90:runBr+90);
   const p3=dest(dest(c,halfL,runBr+180),halfW,s==='N'?runBr-90:runBr+90);
   const p4=dest(dest(c,halfL,runBr+180),halfW,s==='N'?runBr+90:runBr-90);
   L.polygon([p1,p2,p3,p4],{color:'#ffffff',weight:.6,opacity:.35,fillOpacity:.02}).addTo(map);
   if(k===1) L.marker(c,{opacity:.75,icon:L.divIcon({className:'',html:`<div style="font-size:9px;font-weight:700;color:#fff;text-shadow:0 0 3px #000">${i}</div>`})}).addTo(map);
 }
}
L.marker(ARP).addTo(map).bindPopup('<b>Gan International Airport</b><br>ARP');

let userMarker=null,accuracyCircle=null,lastPos=null;
function status(msg,cls=''){const e=document.getElementById('gpsStatus');e.textContent=msg;e.className='status '+cls}
function showPos(lat,lng,acc){
 lastPos=[lat,lng];
 const g=gridFor(lastPos);
 if(!userMarker) userMarker=L.marker(lastPos,{zIndexOffset:1000}).addTo(map);
 else userMarker.setLatLng(lastPos);
 userMarker.bindPopup(`<b>YOU ARE HERE</b><br>Grid: ${g}<br>Accuracy: ±${Math.round(acc)} m`);
 if(!accuracyCircle) accuracyCircle=L.circle(lastPos,{radius:acc,weight:1,fillOpacity:.08}).addTo(map);
 else accuracyCircle.setLatLng(lastPos).setRadius(acc);
 document.getElementById('positionInfo').textContent=`${lat.toFixed(6)}, ${lng.toFixed(6)} • Grid ${g} • ±${Math.round(acc)} m`;
}
function locate(){
 if(!navigator.geolocation){status('GPS is not supported by this browser','err');return}
 status('Requesting GPS permission…');
 navigator.geolocation.getCurrentPosition(p=>{
   showPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
   map.setView([p.coords.latitude,p.coords.longitude],18);
   status('GPS active','ok');
 },e=>{
   let m='GPS unavailable';
   if(e.code===1)m='Location permission denied — enable Safari Location access';
   if(e.code===2)m='Position unavailable — move outdoors / wait for GPS';
   if(e.code===3)m='GPS request timed out — try again';
   status(m,'err');
 },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
document.getElementById('locateBtn').onclick=locate;
document.getElementById('fodBtn').onclick=()=>{
 if(!lastPos){locate(); setTimeout(()=>openReport(),500); return}
 openReport();
};
function openReport(){
 if(!lastPos){alert('Please obtain GPS first.');return}
 const g=gridFor(lastPos);
 document.getElementById('lat').value=lastPos[0].toFixed(7);
 document.getElementById('lng').value=lastPos[1].toFixed(7);
 document.getElementById('grid').value=g;
 document.getElementById('utc').value=new Date().toISOString().replace('T',' ').replace('Z',' UTC');
 document.getElementById('modal').classList.add('show');
}
document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('save').onclick=()=>{
 const report={
  id:Date.now(),lat:lastPos[0],lng:lastPos[1],grid:gridFor(lastPos),
  utc:new Date().toISOString(),type:document.getElementById('type').value,
  description:document.getElementById('desc').value
 };
 const arr=JSON.parse(localStorage.getItem('gan_fod_reports')||'[]');arr.push(report);
 localStorage.setItem('gan_fod_reports',JSON.stringify(arr));
 const icon=L.divIcon({className:'fod-pin',html:'⚠️',iconSize:[30,30],iconAnchor:[15,15]});
 L.marker(lastPos,{icon}).addTo(map).bindPopup(`<b>FOD</b><br>Grid: ${report.grid}<br>${report.type}<br>${report.description||''}<br><small>${report.utc}</small>`);
 document.getElementById('modal').classList.remove('show');
 document.getElementById('desc').value='';
 alert('FOD report saved on this device.');
};
map.on('click',e=>{});
</script>
</body>
</html>
