<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gan Airport FOD Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#111923;color:#fff}header{padding:14px;background:#172534}h1{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:#aebdca}
#status{padding:8px 12px;background:#0e1720;font-size:12px;color:#c4d1dc}#map{height:calc(100vh - 120px);min-height:520px;position:relative;overflow:hidden;background:linear-gradient(90deg,#ffffff18 1px,transparent 1px) 0 0/100px 100px,linear-gradient(#ffffff18 1px,transparent 1px) 0 0/100px 100px,linear-gradient(135deg,#506b55,#788d68 50%,#526d56)}
.grid{position:absolute;inset:7% 5%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr)}.cell{border:1px solid #ffffff4d;padding:5px;font-size:10px;color:#ffffffb8}
.runway{position:absolute;left:5%;right:5%;top:42%;height:23%;background:#30353a;border:2px solid #ddd}.center{position:absolute;left:2%;right:2%;top:50%;border-top:3px dashed white}.edge{position:absolute;left:0;right:0;border-top:3px solid white}.edge.t{top:12%}.edge.b{bottom:12%}.rwy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;letter-spacing:6px}
.you{position:absolute;width:22px;height:22px;border:3px solid white;border-radius:50%;background:#19a974;transform:translate(-50%,-50%);box-shadow:0 0 0 8px #19a97433;z-index:4}.fod{position:absolute;width:18px;height:18px;border-radius:50%;background:#e34848;border:2px solid white;transform:translate(-50%,-50%);z-index:5}.fod span{position:absolute;left:22px;top:-3px;background:#351717;padding:3px 5px;border-radius:3px;font-size:10px;white-space:nowrap}
.panel{position:absolute;bottom:14px;left:12px;right:12px;background:#0c141df2;border:1px solid #405365;border-radius:12px;padding:12px;z-index:10}.row{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:8px;padding:12px 7px;font-weight:bold;background:#285b83;color:#fff}.green{background:#167b55}.gray{background:#334454}small{color:#9fb0bf}
#form{display:none;position:absolute;inset:0;background:#091018f7;z-index:20;padding:18px;overflow:auto}.field{margin:12px 0}.field label{display:block;font-size:11px;color:#9fb0bf;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border-radius:7px;border:1px solid #43576a;background:#172432;color:#fff}textarea{min-height:70px}.actions{display:flex;gap:8px;margin-top:16px}
</style></head><body>
<header><h1>GAN AIRPORT — FOD INSPECTION</h1><div class="sub">Mobile prototype • GPS + airport grid + FOD reporting</div></header>
<div id="status">GPS: requesting permission…</div>
<div id="map"><div class="grid" id="grid"></div><div class="runway"><div class="edge t"></div><div class="center"></div><div class="edge b"></div><div class="rwy">10 ───── 28</div></div>
<div class="fod" style="left:62%;top:51%"><span>F001 Metal</span></div><div class="fod" style="left:35%;top:58%"><span>F002 Stone</span></div><div class="you" id="you" style="left:50%;top:54%"></div>
<div class="panel"><div style="margin-bottom:8px"><small>Current grid</small><div id="gridNow" style="font-size:16px;font-weight:bold">—</div></div>
<div class="row"><button class="btn green" onclick="openFod()">➕ REPORT FOD</button><button class="btn" onclick="locate()">📍 MY LOCATION</button></div>
<div class="row" style="margin-top:8px"><button class="btn gray" onclick="openMaps()">🗺 GOOGLE MAPS</button><button class="btn gray" onclick="fodList()">📋 FOD LIST</button></div></div>
<div id="form"><h2>Report FOD</h2><div class="field"><label>GPS POSITION</label><input id="gps" readonly value="Waiting for GPS…"></div>
<div class="field"><label>GRID</label><input id="fg" readonly></div><div class="field"><label>RUNWAY / AREA</label><select id="rwy"><option>Runway 10/28</option><option>Taxiway</option><option>Apron</option><option>Other</option></select></div>
<div class="field"><label>FOD TYPE</label><select id="type"><option>Metal</option><option>Stone</option><option>Plastic</option><option>Rubber</option><option>Wildlife</option><option>Other</option></select></div>
<div class="field"><label>DESCRIPTION</label><textarea id="desc" placeholder="Example: small metal object near runway edge"></textarea></div>
<div class="field"><label>PHOTO</label><input type="file" accept="image/*" capture="environment"></div>
<div class="actions"><button class="btn gray" onclick="closeFod()">CANCEL</button><button class="btn green" onclick="saveFod()">SAVE FOD</button></div></div></div>
<script>
let last={lat:null,lon:null,acc:null};
const g=document.getElementById('grid');for(let r=0;r<6;r++)for(let c=0;c<8;c++){let d=document.createElement('div');d.className='cell';d.textContent=String.fromCharCode(65+r)+(c+1);g.appendChild(d)}
function status(t){document.getElementById('status').textContent=t}
function locate(){if(!navigator.geolocation)return status('GPS is not supported by this browser.');status('Requesting GPS…');navigator.geolocation.getCurrentPosition(p=>{last={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};status(`GPS: ${last.lat.toFixed(6)}, ${last.lon.toFixed(6)} • accuracy ±${Math.round(last.acc)} m`);document.getElementById('gridNow').textContent=demoGrid(last.lat,last.lon);document.getElementById('gps').value=`${last.lat.toFixed(6)}, ${last.lon.toFixed(6)} (±${Math.round(last.acc)} m)`;document.getElementById('fg').value=demoGrid(last.lat,last.lon)},e=>status('GPS unavailable: '+e.message),{enableHighAccuracy:true,timeout:10000,maximumAge:5000})}
function demoGrid(){return 'C03'} // placeholder until real Gan airport boundaries are entered
function openFod(){document.getElementById('form').style.display='block';if(last.lat==null)locate()}
function closeFod(){document.getElementById('form').style.display='none'}
function saveFod(){alert('FOD saved in this demo. The production version will save it to a database with photo, GPS, grid, time and inspector.');closeFod()}
function openMaps(){if(last.lat==null)return alert('Press MY LOCATION first.');window.open(`https://www.google.com/maps?q=${last.lat},${last.lon}`,'_blank')}
function fodList(){alert('OPEN FOD\nF001 — Metal — C05\nF002 — Stone — B03')}
locate();
</script></body></html>
